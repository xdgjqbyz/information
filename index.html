<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #0a0a12;
    overflow: hidden;
    position: relative;
  }

  /* 背景流动光斑 */
  body::before,
  body::after {
    content: "";
    position: absolute;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.55;
    animation: drift 18s ease-in-out infinite alternate;
  }
  body::before {
    width: 520px; height: 520px;
    background: radial-gradient(circle, #6d5dfc, transparent 70%);
    top: -140px; left: -120px;
  }
  body::after {
    width: 460px; height: 460px;
    background: radial-gradient(circle, #00c2a8, transparent 70%);
    bottom: -160px; right: -100px;
    animation-delay: -9s;
  }

  @keyframes drift {
    0%   { transform: translate(0, 0) scale(1); }
    100% { transform: translate(60px, 40px) scale(1.15); }
  }

  .card {
    position: relative;
    z-index: 1;
    width: min(92vw, 540px);
    padding: 48px 40px;
    border-radius: 24px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
    text-align: center;
    color: #fff;
    animation: rise 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(28px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .badge {
    display: inline-block;
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 12px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: #a8f0e0;
    background: rgba(0, 194, 168, 0.12);
    border: 1px solid rgba(0, 194, 168, 0.35);
    margin-bottom: 24px;
  }

  h1 {
    font-size: clamp(26px, 5vw, 36px);
    font-weight: 700;
    letter-spacing: -0.5px;
    line-height: 1.25;
    background: linear-gradient(135deg, #ffffff 0%, #b9b3ff 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 14px;
  }

  p {
    font-size: 15px;
    line-height: 1.7;
    color: rgba(255, 255, 255, 0.62);
    margin-bottom: 32px;
  }

  .actions {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
  }

  a.btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 26px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
    transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
  }

  .btn-primary {
    color: #0a0a12;
    background: linear-gradient(135deg, #ffffff, #d8d4ff);
    box-shadow: 0 8px 24px rgba(160, 150, 255, 0.3);
  }
  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 30px rgba(160, 150, 255, 0.45);
  }

  .btn-ghost {
    color: rgba(255, 255, 255, 0.8);
    border: 1px solid rgba(255, 255, 255, 0.18);
    background: rgba(255, 255, 255, 0.04);
  }
  .btn-ghost:hover {
    background: rgba(255, 255, 255, 0.1);
    transform: translateY(-2px);
  }

  footer {
    margin-top: 36px;
    font-size: 12px;
    color: rgba(255, 255, 255, 0.3);
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>
  <main class="card">
    <span class="badge">Deployed on Cloudflare</span>
    <h1>你好，这里是我的主页</h1>
    <p>这个页面由 Cloudflare Pages 驱动，从 GitHub 仓库自动构建发布。简洁、快速、无需服务器。</p>
    <div class="actions">
      <a class="btn btn-primary" href="https://github.com" target="_blank" rel="noopener">访问 GitHub</a>
      <a class="btn btn-ghost" href="https://developers.cloudflare.com/pages/" target="_blank" rel="noopener">Cloudflare Pages</a>
    </div>
    <footer>© 2025 · Built with ❤️</footer>
  </main>
</body>
</html>
